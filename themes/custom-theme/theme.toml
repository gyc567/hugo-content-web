# theme.toml template for a Hugo theme
# See https://github.com/gohugoio/hugoThemes#themetoml for an example

name = "GitHot Theme"
license = "MIT"
licenselink = "https://github.com/yourusername/githot/blob/main/LICENSE"
description = "GitHot - GitHub热门项目评测"
homepage = "https://github.com/yourusername/githot"
tags = ["blog", "seo", "search", "likes", "monetag", "responsive", "clean", "modern"]
features = ["search", "likes", "seo", "monetag", "responsive", "fast"]
min_version = "0.100.0"

[author]
  name = "GitHot"
  homepage = "https://github.com/yourusername/githot"

# If porting an existing theme
[original]
  name = ""
  homepage = ""
  repo = ""